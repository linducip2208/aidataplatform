name: aidataplatform

x-common-env: &common-env
  TZ: ${TZ:-Asia/Jakarta}
  APP_ENV: ${APP_ENV:-production}

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: aidata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aidata}
      POSTGRES_USER: ${POSTGRES_USER:-aidata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aidata} -d $${POSTGRES_DB:-aidata}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    container_name: aidata-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    # NOTE: if REDIS_PASSWORD is empty, override command via REDIS_CMD env in production.
    # Simpler alternative: remove --requirepass when no password is set. See docs/deployment.md.
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - appnet

  laravel:
    build:
      context: ./application
      dockerfile: ../infrastructure/docker/laravel.Dockerfile
    container_name: aidata-laravel
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-AIDataPlatform}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-aidata}
      DB_USERNAME: ${POSTGRES_USER:-aidata}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      AI_ENGINE_URL: ${AI_ENGINE_URL:-http://fastapi:8000}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      QUALITY_THRESHOLD: ${QUALITY_THRESHOLD:-0.75}
    volumes:
      - ./application:/var/www/html
      - laravel-storage:/var/www/html/storage
      - datasets-data:/var/www/html/storage/app/datasets
      - models-cache:/var/www/html/storage/app/models
    expose:
      - "8000"
    ports:
      - "${LARAVEL_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/up || curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - appnet

  fastapi:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: aidata-fastapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aidata}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aidata}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-aidata}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aidata}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/${REDIS_DB:-0}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/${CELERY_BROKER_DB:-1}
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/${CELERY_RESULT_DB:-2}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-3.5-sonnet}
      EMBED_MODEL: ${EMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      QUALITY_THRESHOLD: ${QUALITY_THRESHOLD:-0.75}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
    volumes:
      - ./ai-engine:/app
      - datasets-data:/app/data/datasets
      - models-cache:/app/data/models
    expose:
      - "8000"
    ports:
      - "${FASTAPI_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - appnet

  celery-worker:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: aidata-celery-worker
    restart: unless-stopped
    depends_on:
      fastapi:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4} -Q ${CELERY_QUEUES:-default,imports,quality,ml,agent,rag}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aidata}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aidata}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-aidata}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aidata}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/${REDIS_DB:-0}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/${CELERY_BROKER_DB:-1}
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/${CELERY_RESULT_DB:-2}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_API_KEY: ${LLM_API_KEY:-}
      QUALITY_THRESHOLD: ${QUALITY_THRESHOLD:-0.75}
    volumes:
      - ./ai-engine:/app
      - datasets-data:/app/data/datasets
      - models-cache:/app/data/models
    networks:
      - appnet

  celery-beat:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: aidata-celery-beat
    restart: unless-stopped
    depends_on:
      celery-worker:
        condition: service_started
      redis:
        condition: service_healthy
    command: celery -A app.celery_app.celery_app beat --loglevel=info --scheduler ${CELERY_BEAT_SCHEDULER:-redbeat.RedBeatScheduler} --pidfile=/tmp/celerybeat.pid
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/${REDIS_DB:-0}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/${CELERY_BROKER_DB:-1}
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/${CELERY_RESULT_DB:-2}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
    volumes:
      - ./ai-engine:/app
    networks:
      - appnet

  nginx:
    image: nginx:1.27-alpine
    container_name: aidata-nginx
    restart: unless-stopped
    depends_on:
      laravel:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - appnet

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aidata-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - appnet

  grafana:
    image: grafana/grafana:11.2.0
    container_name: aidata-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/aidata-dashboard.json:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - appnet

networks:
  appnet:
    name: ${NETWORK_NAME:-aidata-appnet}
    driver: bridge

volumes:
  pgdata:
    name: ${VOLUME_PREFIX:-aidata}-pgdata
  redis-data:
    name: ${VOLUME_PREFIX:-aidata}-redis-data
  laravel-storage:
    name: ${VOLUME_PREFIX:-aidata}-laravel-storage
  datasets-data:
    name: ${VOLUME_PREFIX:-aidata}-datasets
  models-cache:
    name: ${VOLUME_PREFIX:-aidata}-models
  prometheus-data:
    name: ${VOLUME_PREFIX:-aidata}-prometheus
  grafana-data:
    name: ${VOLUME_PREFIX:-aidata}-grafana
  nginx-logs:
    name: ${VOLUME_PREFIX:-aidata}-nginx-logs
