name: aidataplatform

# Build contexts:
#   laravel  context "."  -> the root .dockerignore applies
#   fastapi  context "./ai-engine" -> ai-engine/.dockerignore applies
#
# infrastructure/docker/laravel.Dockerfile COPYs `application/...` and
# `infrastructure/...`, so its context has to be the repository root. A context
# of ./application with `dockerfile: ../infrastructure/...` is a legal Compose
# combination (build.dockerfile is resolved relative to build.context, and the
# Dockerfile may sit outside the context), but the COPY paths would then resolve
# to application/application/... and the build would fail. Root context is also
# what .github/workflows/docker.yml uses.
#
# The three x-laravel-* blocks below are the build, the environment and the
# volumes shared by `laravel`, `laravel-queue` and `laravel-schedule`. They are
# anchors rather than copies on purpose: a worker booted with a subset of the app
# env does not fail loudly, it falls back to the defaults in
# config/database.php (127.0.0.1) and quietly talks to nothing.

x-laravel-build: &laravel-build
  context: .
  dockerfile: infrastructure/docker/laravel.Dockerfile

x-laravel-environment: &laravel-environment
  APP_NAME: ${APP_NAME:-AIDataPlatform}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost}
  # Deliberately NOT injected. `APP_KEY: ${APP_KEY:-}` would set an empty
  # string, which overrides application/.env (the container env wins), and the
  # entrypoint then dies on an unencrypted key — a crash loop that takes
  # laravel-queue, laravel-schedule and nginx down with it. Generate it once with
  # `php artisan key:generate`; .env.example documents it as required.
  # APP_KEY: ${APP_KEY}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-aidata}
  DB_USERNAME: ${POSTGRES_USER:-aidata}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  # "null" is the literal Laravel's env() maps to PHP null. An empty string
  # is not null, and config/database.php would then call Redis AUTH('') against
  # a passwordless server and fail every cache/session/queue operation.
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  # config/database.php reads the queue's database from REDIS_DB and the cache
  # store's from REDIS_CACHE_DB. Compose injected neither, so the value in the
  # root .env.example was silently ignored and both stores resolved from
  # application/.env instead - which can put the queue on the cache database.
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  AI_ENGINE_URL: ${AI_ENGINE_URL:-http://fastapi:8000}
  SERVICE_API_KEY: ${SERVICE_API_KEY:-}
  SERVICE_API_KEY_HEADER: ${SERVICE_API_KEY_HEADER:-X-Service-Key}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
  QUALITY_THRESHOLD: ${QUALITY_THRESHOLD:-0.75}
  # php artisan serve forks PHP_CLI_SERVER_WORKERS children only when the
  # value is in the process environment. laravel-entrypoint.sh exports it.
  PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}
  # Read by laravel-entrypoint.sh; mirrors the ai-engine/.env.example contract.
  # laravel-queue and laravel-schedule clear that entrypoint, so for them the
  # variable is inert: only the `laravel` service ever migrates.
  AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
  AUTO_MIGRATE_STRICT: ${AUTO_MIGRATE_STRICT:-false}

# The bind mount hides everything the image put in /var/www/html, including
# the Vite build; the assets stage therefore writes to /opt/aidata/vite and
# the entrypoint installs it into public/build on every start.
x-laravel-volumes: &laravel-volumes
  - ./application:/var/www/html
  - laravel-storage:/var/www/html/storage
  - datasets-data:/var/www/html/storage/app/datasets
  - models-cache:/var/www/html/storage/app/models

services:
  # Hardening notes (AGENT 9):
  #   * Every service carries `restart: unless-stopped`; a process that exits is
  #     restarted by the engine. Healthchecks below only mark Unhealthy, they do
  #     not restart on their own -- restart comes from the policy.
  #   * No hard `mem_limit`/`cpus` are set on purpose: a 500 MB upload (nginx
  #     client_max_body_size) plus ML training bursts legitimately exceed any
  #     modest static cap, and a killed worker looks identical to a stuck one.
  #     The leak control is `queue:work --max-time=3600` (hourly recycle) plus
  #     the worker/beat process probes below.
  #   * queue/schedule/worker/beat listen on no port, so their probes are
  #     process-level only. Each probe uses a tool the image is guaranteed to
  #     have (BusyBox `ps` on the PHP image, /proc + python on the slim image).
  #     A wedged-but-alive worker still passes; that case is observed as queue
  #     depth in Redis (docs/monitoring.md section 5), never as a healthcheck.
  #   * prometheus/grafana carry no healthcheck: neither image guarantees
  #     curl/wget, and a probe that cannot run is worse than none (permanent
  #     Unhealthy teaches the operator to ignore health). Container Up is the
  #     signal; Prometheus self-health is `up{job="prometheus"}` on the dashboard.
  #   * Loopback bindings (127.0.0.1:) on laravel/fastapi are intentional: those
  #     ports bypass nginx, so 0.0.0.0 would expose them off-box. Volume names
  #     keep the ${VOLUME_PREFIX:-aidata} prefix; every host value is
  #     ${VAR:-default} interpolated from the root .env.
  postgres:
    image: pgvector/pgvector:pg18
    container_name: aidata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aidata}
      POSTGRES_USER: ${POSTGRES_USER:-aidata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aidata} -d $${POSTGRES_DB:-aidata}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    container_name: aidata-redis
    restart: unless-stopped
    environment:
      # Only used by the `command:` below and by the healthcheck, so that an
      # empty value really means "no password" instead of "--requirepass ''".
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
        else
          exec redis-server --appendonly yes;
        fi
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      # `redis-cli ping` without credentials is rejected once a password is set,
      # which would leave this service permanently unhealthy and block laravel and
      # celery-worker (both use condition: service_healthy).
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG;
          else
            redis-cli ping | grep -q PONG;
          fi
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - appnet

  laravel:
    build: *laravel-build
    container_name: aidata-laravel
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *laravel-environment
    volumes: *laravel-volumes
    expose:
      - "8000"
    ports:
      # Published for tests/run.sh (BASE_LARAVEL). Loopback only: this path
      # bypasses nginx, so on 0.0.0.0 it would expose the app's own port to
      # every interface, not just the machine.
      - "127.0.0.1:${LARAVEL_PORT:-8080}:8000"
    healthcheck:
      # /up only proves the framework booted, so the Vite manifest and the
      # migration marker are checked too. The entrypoint writes the marker when
      # `artisan migrate --force` fails, which keeps a broken schema from
      # reporting healthy.
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null http://localhost:8000/up
          && test -f /var/www/html/public/build/manifest.json
          && test ! -f /var/www/html/storage/framework/migrate_failed
          || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - appnet

  # Consumes the `datasets` queue RefreshQualityScoreJob is pushed onto
  # ($this->onQueue('datasets') in application/app/Jobs). `default` is listed
  # too so a job dispatched without an explicit queue is still executed.
  laravel-queue:
    build: *laravel-build
    container_name: aidata-laravel-queue
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The laravel-storage volume hides storage/framework and storage/logs on
      # first boot, and laravel-entrypoint.sh is the only thing that recreates
      # them. Waiting for `laravel` to be healthy means the schema is migrated
      # and the skeleton exists before the first job tries to log anything.
      laravel:
        condition: service_healthy
    # laravel-entrypoint.sh ends in `exec php artisan serve`, so a `command:`
    # alone would be ignored and this container would serve HTTP on 8000. An
    # empty entrypoint clears the image ENTRYPOINT (Compose spec) and leaves
    # `command:` as PID 1. The boot steps the entrypoint performs are covered by
    # the `laravel: service_healthy` gate above.
    entrypoint: []
    command:
      - php
      - artisan
      - queue:work
      - --queue=datasets,default
      - --tries=3
      - --backoff=30
      # Laravel recycles the worker process after an hour so a slow leak cannot
      # accumulate; `restart: unless-stopped` starts the replacement.
      - --max-time=3600
    environment:
      <<: *laravel-environment
    volumes: *laravel-volumes
    # Process-level only: this worker listens on no port and no artisan command
    # reports on a running worker (Horizon is not a dependency; `queue:monitor`
    # needs Horizon tables and would false-negative here). `ps` is BusyBox in
    # the php:8.3-fpm-alpine image, so it always exists. A wedged-but-alive
    # worker still passes here; that case is visible as a queue depth that stops
    # falling in Redis (docs/monitoring.md section 5).
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[q]ueue:work' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - appnet

  laravel-schedule:
    build: *laravel-build
    container_name: aidata-laravel-schedule
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # withoutOverlapping() stores its mutex in the cache store (redis here), and
      # both scheduled commands read the datasets table.
      laravel:
        condition: service_healthy
    # Same entrypoint override as laravel-queue; schedule:work must be PID 1.
    entrypoint: []
    # schedule:work, not schedule:run. schedule:run is one-shot - it fires the
    # due tasks and exits - so as a container command it would run the schedule
    # once and stop. Nothing else in this stack calls it (no cron, no host
    # crontab entry), which is what left routes/console.php dead code.
    # schedule:work is the long-running form: it re-execs schedule:run once a
    # minute, forever, and it is what composes well with `restart: unless-stopped`.
    # withoutOverlapping() is honoured inside the schedule:run it spawns, and
    # --whisper keeps "no scheduled commands were ready" out of the logs at that
    # cadence.
    # The engine is deliberately not a depends_on: both scheduled commands
    # preflight it themselves and exit non-zero, and withoutOverlapping(30)
    # releases the lock when the process ends, so an engine outage costs one
    # failed run in the log rather than the whole scheduler.
    command:
      - php
      - artisan
      - schedule:work
      - --whisper
    environment:
      <<: *laravel-environment
    volumes: *laravel-volumes
    # Process-level only, same reasoning as laravel-queue: schedule:work is an
    # infinite loop that listens on no port, so the only failure mode the probe
    # can see is "the process is gone" (exit is already covered by the restart
    # policy). A skipped minute is not observable from inside the container.
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[s]chedule:work' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - appnet

  fastapi:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: aidata-fastapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aidata}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aidata}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-aidata}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aidata}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/${REDIS_DB:-0}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/${CELERY_BROKER_DB:-1}
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/${CELERY_RESULT_DB:-2}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      SERVICE_API_KEY_HEADER: ${SERVICE_API_KEY_HEADER:-X-Service-Key}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-3.5-sonnet}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      QUALITY_THRESHOLD: ${QUALITY_THRESHOLD:-0.75}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      # celery_app.py reads TZ; without it the containers ran UTC while the
      # Laravel app and the seeders are configured for Asia/Jakarta.
      TZ: ${TZ:-Asia/Jakarta}
      # ai-engine/Dockerfile works in /code and docker-entrypoint.sh defaults
      # APP_DIR to /code, so the bind mount and the writable data directories have
      # to live under /code. The previous /app paths mounted nothing: the engine
      # wrote uploads and model artefacts into the container layer, where they were
      # lost on recreate and invisible to laravel.
      APP_DIR: /code
      STORAGE_PATH: /code/data/datasets
      MODEL_PATH: /code/data/models
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      AUTO_MIGRATE_STRICT: ${AUTO_MIGRATE_STRICT:-false}
      PGHOST_FOR_MIGRATION: postgres
      PGPORT_FOR_MIGRATION: 5432
    volumes:
      - ./ai-engine:/code
      - datasets-data:/code/data/datasets
      - models-cache:/code/data/models
    expose:
      - "8000"
    ports:
      # Published for tests/run.sh (BASE_AI). Loopback only, and not intended
      # for a public host: this port serves the whole engine API, which nginx
      # otherwise keeps behind the cleared service-key header.
      - "127.0.0.1:${FASTAPI_PORT:-8001}:8000"
    healthcheck:
      # Probes readiness and checks the reported verdict, not the status code:
      # /api/v1/readiness answers 200 whether or not it is ready, and
      # /api/v1/health is a static liveness string. Gating the stack on either
      # one marks a service with no schema as healthy. The entrypoint also
      # tolerates a failed `alembic upgrade head`, so this is the only signal.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/api/v1/readiness', timeout=5); sys.exit(0 if b'\\\"ready\\\": true' in r.read() or b'\\\"ready\\\":true' in r.read() else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - appnet

  celery-worker:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: aidata-celery-worker
    restart: unless-stopped
    depends_on:
      fastapi:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4} -Q ${CELERY_QUEUES:-default,imports,quality,ml,agent,rag}
    environment:
      APP_DIR: /code
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aidata}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aidata}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-aidata}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-aidata}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/${REDIS_DB:-0}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/${CELERY_BROKER_DB:-1}
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/${CELERY_RESULT_DB:-2}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      SERVICE_API_KEY_HEADER: ${SERVICE_API_KEY_HEADER:-X-Service-Key}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # The worker runs the LLM tasks (agent, report), so it needs the same
      # provider configuration as the API. Without these it fell back to
      # api.openai.com / gpt-4o-mini while the API used openrouter.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-3.5-sonnet}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      QUALITY_THRESHOLD: ${QUALITY_THRESHOLD:-0.75}
      STORAGE_PATH: /code/data/datasets
      MODEL_PATH: /code/data/models
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ./ai-engine:/code
      - datasets-data:/code/data/datasets
      - models-cache:/code/data/models
    # Process-level only: the worker listens on no port. `celery inspect ping`
    # was rejected as a probe: it needs the broker on every check, so a Redis
    # blip marks a healthy worker unhealthy. /proc is kernel-provided and
    # python IS the image (python:3.13-slim, no procps guarantee), so this probe
    # has no package dependency. A wedged-but-alive worker still passes; watch
    # queue depth in Redis (docs/monitoring.md section 5).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import glob,sys; sys.exit(0 if any('celery' in open(f,errors='ignore').read() for f in glob.glob('/proc/[0-9]*/cmdline')) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - appnet

  celery-beat:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: aidata-celery-beat
    restart: unless-stopped
    depends_on:
      celery-worker:
        condition: service_started
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info --scheduler ${CELERY_BEAT_SCHEDULER:-celery.beat.PersistentScheduler} --pidfile=/tmp/celerybeat.pid
    environment:
      APP_DIR: /code
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/${REDIS_DB:-0}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/${CELERY_BROKER_DB:-1}
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/${CELERY_RESULT_DB:-2}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      SERVICE_API_KEY_HEADER: ${SERVICE_API_KEY_HEADER:-X-Service-Key}
      # Beat only schedules; it must not run migrations.
      AUTO_MIGRATE: "false"
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ./ai-engine:/code
    # Process-level only: beat listens on no port and its --pidfile alone proves
    # nothing (a path, not a process). Same /proc + python reasoning as the
    # worker above; the match string is 'beat' so a worker process cannot satisfy
    # this probe. A beat that exits is restarted by the policy; a beat that is
    # alive but not scheduling is visible as missed entries (nightly sync at
    # 01:15, hourly report, per-minute alert evaluation -- see
    # ai-engine/app/workers/celery_app.py).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import glob,sys; sys.exit(0 if any('beat' in open(f,errors='ignore').read() for f in glob.glob('/proc/[0-9]*/cmdline')) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - appnet

  nginx:
    image: nginx:1.27-alpine
    container_name: aidata-nginx
    restart: unless-stopped
    depends_on:
      laravel:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # infrastructure/nginx/ssl/ ships empty; default.conf references no
      # certificate, so nginx starts. Add real certs before enabling the :443
      # server block.
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - appnet

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aidata-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alert rules are evaluated inside Prometheus (rule_files in prometheus.yml
      # points at this path). Read-only like the main config; edit the source
      # file and reload with POST /-/reload (--web.enable-lifecycle above).
      - ./infrastructure/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - appnet

  grafana:
    image: grafana/grafana:11.2.0
    container_name: aidata-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    # Grafana only auto-loads dashboards from the provisioning directory when a
    # provider YAML is present, and the dashboard needs a datasource named
    # "Prometheus". Both are supplied inline (needs Docker Compose >= 2.23.1 for
    # `configs.content`); the dashboard JSON itself stays a normal bind mount so
    # it can be edited without touching this file.
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/aidata-prometheus.yaml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/aidata-provider.yaml
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/aidata-dashboard.json:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - appnet

networks:
  appnet:
    name: ${NETWORK_NAME:-aidata-appnet}
    driver: bridge

volumes:
  pgdata:
    name: ${VOLUME_PREFIX:-aidata}-pgdata
  redis-data:
    name: ${VOLUME_PREFIX:-aidata}-redis-data
  laravel-storage:
    name: ${VOLUME_PREFIX:-aidata}-laravel-storage
  datasets-data:
    name: ${VOLUME_PREFIX:-aidata}-datasets
  models-cache:
    name: ${VOLUME_PREFIX:-aidata}-models
  prometheus-data:
    name: ${VOLUME_PREFIX:-aidata}-prometheus
  grafana-data:
    name: ${VOLUME_PREFIX:-aidata}-grafana
  nginx-logs:
    name: ${VOLUME_PREFIX:-aidata}-nginx-logs

configs:
  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false
  grafana_dashboard_provider:
    content: |
      apiVersion: 1
      providers:
        - name: aidata
          orgId: 1
          folder: AIDataPlatform
          type: file
          disableDeletion: false
          updateIntervalSeconds: 30
          allowUiUpdates: true
          options:
            path: /etc/grafana/provisioning/dashboards
            foldersFromFilesStructure: false
