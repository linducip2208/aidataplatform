# AIDataPlatform — aaPanel Nginx site template (production, no Docker).
#
# Install: aaPanel > Website > Add site (PHP 8.3), then replace the generated
# server block with this file's contents, substituting:
#   {{DOMAIN}}       e.g. data.example.com
#   {{APP_DIR}}      repo root, e.g. /www/wwwroot/aidata
#   {{PHP_FPM_SOCK}} aaPanel PHP 8.3 socket, e.g. unix:/tmp/php-cgi-83.sock
#                    (copy the fastcgi_pass line from any working aaPanel PHP
#                    site if unsure — the socket name varies by panel version)
#
# Path contract (mirrors infrastructure/nginx/default.conf):
#   /                     -> Laravel public/ via php-fpm (unchanged paths)
#   /ai-api/<engine path> -> 127.0.0.1:8001 (prefix stripped, loopback only)
#
# TLS: issue the Let's Encrypt certificate from the aaPanel site panel AFTER
# this file loads cleanly on :80; aaPanel writes the 443 server block itself.
# Only then uncomment the HSTS line below.

server {
    listen 80;
    server_name {{DOMAIN}};
    root {{APP_DIR}}/application/public;
    index index.php index.html;

    access_log /www/wwwlogs/{{DOMAIN}}.log combined;
    error_log /www/wwwlogs/{{DOMAIN}}.error.log warn;

    # Must stay >= MAX_UPLOAD_MB (500): otherwise dataset uploads die with
    # 413 before Laravel ever sees them.
    client_max_body_size 500M;
    client_body_timeout 300s;

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # enable with TLS
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml;
    gzip_min_length 1024;

    # Built frontend + uploads: cache immutable build output, never PHP.
    location ~* ^/build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # ---- FastAPI: prefix stripped, credentials stripped, allowlisted ----
    location /ai-api/ {
        rewrite ^/ai-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host fastapi;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header X-Service-Key "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # The engine's authenticated surface, refused at the edge (404, not 401:
    # do not confirm which engine routes exist). Probes stay reachable.
    location ~ ^/ai-api/api/(?!v1/(health|readiness|liveness)/?$) {
        access_log off;
        return 404;
    }
    location = /ai-api/metrics { access_log off; return 404; }
    location = /ai-api/metrics/ { access_log off; return 404; }
    location = /ai-api { return 301 /ai-api/; }
    location = /openapi.json { return 307 /ai-api/openapi.json; }
    location ~ ^/ai-api/(docs|redoc|openapi\.json|health|readiness|liveness|api/v1/(health|readiness|liveness))/$ {
        return 307 /ai-api/$1;
    }

    # ---- Laravel ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Never serve anything outside public/: a request that reaches here
        # for a non-existent script must 404, not execute.
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass {{PHP_FPM_SOCK}};
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # Dotfiles, .env, storage internals and source must never be served.
    location ~ /\. { deny all; access_log off; }
    location ~* ^/(storage|vendor|node_modules|\.env) { deny all; access_log off; }
}
