; AIDataPlatform — FastAPI engine (aaPanel Supervisor template).
;
; Replace {{APP_USER}}, {{APP_DIR}} (see aidata-laravel-queue.conf).
; Listens on 127.0.0.1:8001 ONLY: Nginx proxies /ai-api/ to it, and the
; service-key auth must never be reachable off-box. --workers 2 matches the
; container CMD; see docs/monitoring.md for the per-worker metric caveat.

[program:aidata-fastapi]
command=%(ENV_APP_DIR)s/ai-engine/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8001 --workers 2
directory=%(ENV_APP_DIR)s/ai-engine
user={{APP_USER}}
environment=APP_DIR="{{APP_DIR}}"
autostart=true
autorestart=true
startsecs=15
startretries=5
redirect_stderr=true
stdout_logfile=/www/wwwlogs/aidata-fastapi.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
