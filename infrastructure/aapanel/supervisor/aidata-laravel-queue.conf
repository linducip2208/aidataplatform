; AIDataPlatform — Laravel queue worker (aaPanel Supervisor template).
;
; Install: copy to /www/server/panel/plugin/supervisor/conf/ (via the
; Supervisor Manager plugin) or /etc/supervisor/conf.d/, replacing:
;   {{APP_USER}}  Linux user that owns the site (aaPanel default: www)
;   {{APP_DIR}}   repo root, e.g. /www/wwwroot/aidata
;   {{PHP_BIN}}   e.g. /www/server/php/83/bin/php
;
; Consumes the `datasets` and `default` queues (RefreshQualityScoreJob rides
; `datasets`; undispatched jobs fall to `default`). --max-time=3600 recycles
; the worker hourly so a slow leak cannot accumulate; Supervisor restarts it.

[program:aidata-laravel-queue]
command={{PHP_BIN}} %(ENV_APP_DIR)s/application/artisan queue:work --queue=datasets,default --tries=3 --backoff=30 --max-time=3600
directory=%(ENV_APP_DIR)s/application
user={{APP_USER}}
environment=APP_DIR="{{APP_DIR}}"
autostart=true
autorestart=true
startsecs=10
startretries=5
redirect_stderr=true
stdout_logfile=/www/wwwlogs/aidata-laravel-queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
