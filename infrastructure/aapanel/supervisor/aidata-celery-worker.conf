; AIDataPlatform — Celery worker (aaPanel Supervisor template).
;
; Replace {{APP_USER}}, {{APP_DIR}} (see aidata-laravel-queue.conf).
; Queues mirror docker-compose.yml CELERY_QUEUES; every routed queue must be
; consumed here or tasks strand invisibly. Concurrency 4 matches
; CELERY_CONCURRENCY; raise it only with DB pool headroom to match.

[program:aidata-celery-worker]
command={{APP_DIR}}/ai-engine/.venv/bin/celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=4 -Q default,imports,quality,ml,agent,rag
directory={{APP_DIR}}/ai-engine
user={{APP_USER}}
environment=APP_DIR="{{APP_DIR}}"
autostart=true
autorestart=true
startsecs=15
startretries=5
redirect_stderr=true
stdout_logfile=/www/wwwlogs/aidata-celery-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
