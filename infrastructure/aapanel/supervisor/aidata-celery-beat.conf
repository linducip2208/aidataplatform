; AIDataPlatform — Celery beat scheduler (aaPanel Supervisor template).
;
; Replace {{APP_USER}}, {{APP_DIR}} (see aidata-laravel-queue.conf). Exactly
; ONE beat process per deployment: two beats double-fire nightly-data-sync,
; hourly-ai-report and the per-minute alert-evaluation. The pidfile lives
; under /tmp so a stale file cannot survive a reboot.

[program:aidata-celery-beat]
command=%(ENV_APP_DIR)s/ai-engine/.venv/bin/celery -A app.workers.celery_app.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler --pidfile=/tmp/aidata-celerybeat.pid
directory=%(ENV_APP_DIR)s/ai-engine
user={{APP_USER}}
environment=APP_DIR="{{APP_DIR}}"
autostart=true
autorestart=true
startsecs=15
startretries=5
redirect_stderr=true
stdout_logfile=/www/wwwlogs/aidata-celery-beat.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
