# AIDataPlatform Nginx reverse proxy (fronts laravel + fastapi)
# Laravel: serves UI + /api/* . FastAPI: served under /ai-api/ (stripped to /).

upstream laravel_app {
    server laravel:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream fastapi_app {
    server fastapi:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/aidata-access.log combined;
    error_log  /var/log/nginx/aidata-error.log warn;

    # Large dataset uploads (must match MAX_UPLOAD_MB + PHP limits)
    client_max_body_size 500M;
    client_body_timeout 300s;
    client_header_timeout 60s;

    # Secure headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # enable when TLS on

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml;
    gzip_min_length 1024;

    # Nginx health (for compose healthcheck)
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ---- FastAPI AI engine under /ai-api/ -> strip prefix ----
    # e.g. /ai-api/docs -> fastapi:8000/docs ; /ai-api/api/v1/health -> /api/v1/health
    location /ai-api/ {
        rewrite ^/ai-api/(.*)$ /$1 break;
        proxy_pass http://fastapi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    # Redirect /ai-api -> /ai-api/ for consistency
    location = /ai-api {
        return 301 /ai-api/;
    }

    # ---- Laravel app (default) ----
    location / {
        proxy_pass http://laravel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
