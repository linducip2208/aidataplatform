# AIDataPlatform Nginx reverse proxy (fronts laravel + fastapi)
#
# Path contract:
#   /                     -> laravel:8000  (paths passed through unchanged)
#   /ai-api/<engine path> -> fastapi:8000 (the /ai-api prefix is stripped)
#
# The engine serves its API under /api/v1/* and its Swagger UI under /docs, so
# a browser reaches them as /ai-api/docs and /ai-api/api/v1/health.
#
# `proxy_pass` carries no URI part ("http://fastapi_app"), so it forwards the
# request URI unchanged and the `rewrite` in `location /ai-api/` owns the prefix
# strip. The replacement supplies the leading slash: that split of labour
# between the two directives is the documented behaviour, and giving
# `proxy_pass` a URI part would make nginx substitute the location prefix
# instead - stripping /ai-api/ a second time and dropping the leading slash.
#
# What a browser may reach on the engine is an explicit allowlist (the
# `location ~ ^/ai-api/api/` block). The engine's authenticated surface is
# server-to-server only: Laravel calls fastapi:8000 directly on the appnet
# network (AI_ENGINE_URL), never through this proxy, and this proxy strips the
# credentials that would authenticate a browser. The allowlist exists so that
# property does not depend on stripping a header whose NAME is configurable -
# see the service-key note beside the proxy_set_header block.
#
# Note: docker-compose.yml also publishes the engine (and Laravel) on host
# ports for tests/run.sh. Those paths bypass everything in this file, so drop
# FASTAPI_PORT and LARAVEL_PORT before exposing this stack beyond a
# development machine.

upstream laravel_app {
    server laravel:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream fastapi_app {
    server fastapi:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Two error_log lines at the same level: nginx writes each message to every
    # one whose level allows it. The file keeps the history on the nginx-logs
    # volume; /dev/stderr is what `docker compose logs nginx` reads, and
    # replacing it with a plain file is why a 502 used to be invisible there.
    access_log /var/log/nginx/aidata-access.log combined;
    error_log  /var/log/nginx/aidata-error.log warn;
    error_log  /dev/stderr warn;

    # Must stay >= MAX_UPLOAD_MB (500) in .env.example, otherwise nginx rejects
    # a dataset upload with 413 before Laravel ever sees it.
    client_max_body_size 500M;
    client_body_timeout 300s;
    client_header_timeout 60s;

    # A 500 MB body is buffered to disk before the upstream is contacted, and
    # the default temp path is inside the container layer, where a few parallel
    # uploads can fill the overlay and fail the request with a 500 rather than
    # a clean 413. The nginx-logs volume is already mounted here and has room.
    client_body_temp_path /var/log/nginx/client_temp;

    # nginx collapses repeated slashes and decodes %XX while parsing the
    # request line, so the location match, the rewrite below and the path the
    # engine finally sees all act on the SAME normalized URI. A path cannot be
    # smuggled past one of them and not the other by encoding a slash or
    # doubling it. Left explicit (it is the default) so the reason is
    # auditable.
    merge_slashes on;

    # Secure headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # enable when TLS on

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml;
    gzip_min_length 1024;

    # Nginx health (for the compose healthcheck). Answers without touching
    # either upstream, so it stays 200 while the app is still booting.
    #
    # `default_type`, not `add_header Content-Type`: the `return` filter already
    # emits a Content-Type (default_type defaults to text/plain), so add_header
    # appended a second one. An `add_header` in this location would also cancel
    # every add_header inherited from the server block, dropping the secure
    # headers above for every response served here.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # ---- FastAPI AI engine: /ai-api/ prefix is stripped ----
    #
    # `proxy_pass` without a URI part passes the request URI through unchanged,
    # so the prefix has to be removed with a rewrite. The rewrite ends in
    # `break` so nginx does not re-match the rewritten URI against prefix
    # locations.
    location /ai-api/ {
        rewrite ^/ai-api/(.*)$ /$1 break;
        proxy_pass http://fastapi_app;
        proxy_http_version 1.1;
        # Pinned, not the caller's Host. Nothing in this stack ever gives the
        # engine a public name: Laravel reaches it as http://fastapi:8000, and
        # only this proxy lets a browser see it at all, so forwarding the
        # caller's Host would hand an attacker-chosen name to anything
        # upstream that builds an absolute URL out of it. The canonical spelling
        # of a redirected path is answered below with a relative Location, so
        # this is the second of the two layers, not the only one.
        proxy_set_header Host fastapi;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        #
        # ---- service key ----
        # The engine accepts TWO credentials (app/core/security.py
        # require_service_auth): the service key in the configured
        # SERVICE_API_KEY_HEADER, and `Authorization: Bearer <jwt>`. Neither may
        # survive this hop, because whoever reaches this proxy is the browser,
        # not Laravel.
        #
        # Authorization has a fixed name, so it is cleared unconditionally.
        # The service key's name is NOT knowable here: it is a root-.env value
        # injected into laravel, fastapi and both Celery services, this file is
        # a read-only bind mount so nothing templates it, and nginx's `env`
        # directive only exports variables to worker processes - it does not
        # expand configuration values, so naming the header through a variable
        # would be an unknown variable and nginx would refuse to start at boot.
        #
        # So the control that does not depend on the name is the allowlist
        # below: a browser cannot reach a route that accepts either credential,
        # so renaming the header stops being a bypass here. Clearing the
        # default name stays as the second layer for the name the engine
        # actually uses - a malformed or reserved configured name falls back to
        # X-Service-Key (resolve_service_key_header), so this line is right for
        # every configuration the engine will itself accept.
        proxy_set_header X-Service-Key "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # The engine's authenticated surface, refused at the edge.
    #
    # Every /api/v1/* route except the three probes is behind
    # require_service_auth, and Laravel - the only legitimate caller - does not
    # come through here. A regex location is matched before any prefix location,
    # so this wins over `location /ai-api/` whatever the order below. The
    # negative lookahead keeps the unauthenticated probes working, because
    # infrastructure/scripts/healthcheck.{sh,ps1} prove the prefix strip with
    # GET /ai-api/api/v1/health, and because the engine serves those three
    # without credentials by design. `/?$` is there so a trailing slash cannot
    # turn a permitted probe into a denied one; $uri is the normalized path, the
    # same string the rewrite above acts on, so encoding cannot separate them.
    # Anything not listed here falls through to `location /ai-api/` and gets the
    # engine's own 404.
    #
    # 404, not 401: the proxy should not confirm which engine routes exist.
    location ~ ^/ai-api/api/(?!v1/(health|readiness|liveness)/?$) {
        access_log off;
        return 404;
    }

    # Canonical spelling of an allowlisted engine path that arrived with a
    # trailing slash. Left to the engine, Starlette's `redirect_slashes` answers
    # /docs/ with `307 Location: <absolute URL built from the request Host>` -
    # a host-header injection into an absolute redirect, and (before the Host
    # pin above) an open redirect straight off this origin. Answering it here
    # with a relative Location reaches the same endpoint with no redirect
    # target an attacker can influence.
    location ~ ^/ai-api/(docs|redoc|openapi\.json|health|readiness|liveness|api/v1/(health|readiness|liveness))/$ {
        return 307 /ai-api/$1;
    }

    # /ai-api and /ai-api/ would otherwise be routed to Laravel by `location /`.
    location = /ai-api {
        return 301 /ai-api/;
    }

    # The engine gates /metrics on the *socket* peer (app/main.py `_is_internal_
    # client`), and it refuses a public scrape unless METRICS_ALLOW_PUBLIC=true.
    # Proxying from here makes the peer the nginx container, which is on the
    # private bridge network, so that check always passes and
    # http://<host>/ai-api/metrics would hand the full scrape to the internet.
    # Prometheus scrapes fastapi:8000 directly (infrastructure/monitoring/
    # prometheus.yml), so refusing it on the browser path costs nothing. 404
    # rather than 403, matching the engine's own choice not to advertise it.
    # Both spellings are refused: an exact match is the only way to catch
    # /ai-api/metrics/ as well, and the trailing-slash spelling would otherwise
    # reach the engine and be answered with a redirect.
    location = /ai-api/metrics {
        access_log off;
        return 404;
    }

    location = /ai-api/metrics/ {
        access_log off;
        return 404;
    }

    # FastAPI's Swagger UI and ReDoc request the schema from the ORIGIN root
    # (`url: '/openapi.json'` in the generated page), not from the page's own
    # directory, so /ai-api/docs made the browser ask for /openapi.json, which
    # fell through to Laravel and 404'd - the docs page rendered with "Failed to
    # load API definition". FastAPI's root_path is not the fix: it is subtracted
    # from the path Starlette matches, so a prefix-stripping proxy plus root_path
    # would 404 every route. The target below is relative, so the Location
    # cannot be steered by a forged Host.
    location = /openapi.json {
        return 307 /ai-api/openapi.json;
    }

    # ---- Laravel app (default) ----
    location / {
        proxy_pass http://laravel_app;
        proxy_http_version 1.1;
        # The caller's Host is correct here and cannot be pinned the way the
        # engine's is: Laravel generates absolute URLs (login redirects, signed
        # download links, password-reset mail) from the request host, and a
        # wrong one breaks the UI. The matching control is an allowlist, not a
        # fixed value, and it cannot live in the application here because this
        # container has no access to APP_URL. Uncomment both lines together
        # once the deployment has a real name; 444 drops the connection without
        # a response, so a forged Host never reaches Laravel.
        #
        #   server_name example.com www.example.com;
        #   if ($host !~ ^(www\.)?example\.com$) { return 444; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# No cache directive exists anywhere in this file, so there is no cache key for
# a forged Host to poison at the proxy. What remains is application-level
# absolute-URL generation on the Laravel hop, which is the allowlist note above.
#
# TLS is not configured here on purpose: infrastructure/nginx/ssl/ is empty on a
# fresh checkout, and an `ssl_certificate` pointing at a missing file makes nginx
# refuse to start at all. Add the server block below once certbot has written
# real fullchain.pem/privkey.pem into that directory, then uncomment the HSTS
# header above and the :443 publication in docker-compose.yml.
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name _;
#
#     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
#     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
#
#     # repeat the client_max_body_size / proxy_* / location blocks from :80
# }
