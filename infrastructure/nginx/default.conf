# AIDataPlatform Nginx reverse proxy (fronts laravel + fastapi)
#
# Path contract:
#   /            -> laravel:8000   (paths passed through unchanged)
#   /ai-api/...  -> fastapi:8000   (the /ai-api prefix is stripped)
#
# The engine serves its API under /api/v1/* and its Swagger UI under /docs, so
# a browser reaches them as /ai-api/api/v1/health and /ai-api/docs.
#
# X-Service-Key is a shared secret that only Laravel's server-to-server client
# (App\Services\AiEngineClient) may present. The engine accepts it instead of a
# bearer token, so forwarding a browser-supplied copy would hand anyone who can
# reach this proxy the ability to impersonate Laravel. The header is therefore
# cleared here, not forwarded.
#
# Note: docker-compose.yml also publishes the engine on a host port for
# tests/run.sh. That path bypasses this stripping, so drop FASTAPI_PORT before
# exposing this stack beyond a development machine.

upstream laravel_app {
    server laravel:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream fastapi_app {
    server fastapi:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/aidata-access.log combined;
    error_log  /var/log/nginx/aidata-error.log warn;

    # Must stay >= MAX_UPLOAD_MB (500) in .env.example, otherwise nginx rejects
    # a dataset upload with 413 before Laravel ever sees it.
    client_max_body_size 500M;
    client_body_timeout 300s;
    client_header_timeout 60s;

    # Secure headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # enable when TLS on

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml;
    gzip_min_length 1024;

    # Nginx health (for the compose healthcheck). Answers without touching
    # either upstream, so it stays 200 while the app is still booting.
    #
    # `default_type`, not `add_header Content-Type`: the `return` filter already
    # emits a Content-Type (default_type defaults to text/plain), so add_header
    # appended a second one. An `add_header` in this location would also cancel
    # every add_header inherited from the server block, dropping the secure
    # headers above for every response served here.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # ---- FastAPI AI engine: /ai-api/ prefix is stripped ----
    #
    # `proxy_pass` without a URI part ("http://fastapi_app") passes the request
    # URI through unchanged, so the prefix has to be removed with a rewrite.
    # The rewrite ends in `break` so nginx does not re-match the rewritten URI
    # against prefix locations.
    location /ai-api/ {
        rewrite ^/ai-api/(.*)$ /$1 break;
        proxy_pass http://fastapi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Never relay a key supplied by the caller.
        proxy_set_header X-Service-Key "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # /ai-api and /ai-api/ would otherwise be routed to Laravel by `location /`.
    location = /ai-api {
        return 301 /ai-api/;
    }

    # The engine gates /metrics on the *socket* peer (app/main.py `_is_internal_
    # client`), and it refuses a public scrape unless METRICS_ALLOW_PUBLIC=true.
    # Proxying from here makes the peer the nginx container, which is on the
    # private bridge network, so that check always passes and
    # http://<host>/ai-api/metrics would hand the full scrape to the internet.
    # Prometheus scrapes fastapi:8000 directly (infrastructure/monitoring/
    # prometheus.yml), so refusing it on the browser path costs nothing. 404
    # rather than 403, matching the engine's own choice not to advertise it.
    location = /ai-api/metrics {
        access_log off;
        return 404;
    }

    # ---- Laravel app (default) ----
    location / {
        proxy_pass http://laravel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# TLS is not configured here on purpose: infrastructure/nginx/ssl/ is empty on a
# fresh checkout, and an `ssl_certificate` pointing at a missing file makes nginx
# refuse to start at all. Add the server block below once certbot has written
# real fullchain.pem/privkey.pem into that directory, then uncomment the HSTS
# header above and the :443 publication in docker-compose.yml.
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name _;
#
#     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
#     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
#
#     # repeat the client_max_body_size / proxy_* / location blocks from :80
# }
