# AIDataPlatform Prometheus scrape config.
#
# Prometheus performs no shell-style variable substitution in this file: a
# "${VAR:-default}" string is not a valid model.Duration and the process refuses
# to start, so the intervals below are literals. Change them here, or supply a
# different file via --config.file.
#
# Every target below was checked against docker-compose.yml: the service name
# exists, it is attached to the appnet network this container is also on (so
# Docker's embedded DNS resolves it), and the port is the one that service
# `expose`s. A target that is not reachable at its scrape address is worse than
# no target: it sits permanently DOWN and teaches the operator to ignore the
# one dashboard they have.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules evaluated inside Prometheus (AGENT 9). The file is mounted
# read-only by docker-compose.yml; after editing it, reload without restart:
#   curl -X POST http://localhost:9090/-/reload   (--web.enable-lifecycle)
# Every rule below fires only on metrics this stack actually exports (see the
# file header for the per-rule source). The disk rule needs the node_exporter
# target, which is NOT in the base stack -- it stays pending until that
# exporter is added, by design rather than by accident.
rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # The engine exposes /metrics from app/main.py and registers the route without
  # an auth dependency, so it needs no credentials.
  #
  # It is reachable, but not public: app/main.py `_is_internal_client` refuses a
  # scrape whose socket peer is a routable address, and METRICS_ALLOW_PUBLIC
  # defaults to false. Note that docker-compose.yml DOES publish the engine on
  # ${FASTAPI_PORT:-8001} for tests/run.sh, so a scrape arriving from the host
  # over that port is a public peer and gets a 404 - the metric is not exposed
  # off-box, but do not treat the published port as harmless.
  #
  # CAVEAT, and it is the reason the numbers on the dashboard are wrong today:
  # the image runs `uvicorn --workers 2` (ai-engine/Dockerfile) and
  # prometheus_client's default REGISTRY is per process. Each worker therefore
  # answers /metrics with its own counters, and both workers publish the same
  # label sets for http_requests_total and the process collector. Prometheus
  # keeps one of the duplicates and drops the other, so every counter on this
  # dashboard is an arbitrary sample of the two workers' values, and rate()
  # over it is not a rate. The engine is a read-only target here: the fix is
  # `--workers 1`, or prometheus_client's multiprocess mode with
  # PROMETHEUS_MULTIPROC_DIR. Until then, treat the trends as indicative and
  # the `up`/duplicate-sample evidence in the Prometheus targets page as the
  # authoritative signal.
  - job_name: fastapi
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["fastapi:8000"]

  # Laravel is NOT scraped: the application registers no /metrics route
  # (bootstrap/app.php only registers the /up health probe), so this target
  # would sit permanently DOWN. Add promphp/prometheus_client_php and a
  # /metrics route before re-enabling it.

  # Redis and Postgres exporters are not part of the base compose stack. To add
  # them, run the exporters on the appnet network and uncomment the jobs:
  #
  #   - job_name: redis
  #     metrics_path: /metrics
  #     scrape_interval: 15s
  #     static_configs:
  #       - targets: ["redis-exporter:9121"]
  #
  #   - job_name: postgres
  #     metrics_path: /metrics
  #     scrape_interval: 30s
  #     static_configs:
  #       - targets: ["postgres-exporter:9187"]

  # Prometheus scrapes itself, which is what makes `up{job="prometheus"}` and
  # `scrape_samples_scraped` available to compare against the engine job.
  - job_name: prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
