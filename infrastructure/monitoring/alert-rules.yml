# AIDataPlatform Prometheus alert rules (AGENT 9).
#
# Evaluated inside Prometheus via `rule_files` in prometheus.yml (mounted
# read-only by docker-compose.yml; reload with POST /-/reload).
#
# Source-of-truth per rule -- every expression below references ONLY metrics
# that exist in this tree, or names the exporter that would provide them:
#
#   EngineErrorRate    http_requests_total{method,path,status}
#                      (ai-engine/app/main.py:23, Counter). The 5xx share is
#                      sum(rate(5xx)) / clamp_min(sum(rate(all)), 0.001); the
#                      clamp keeps an idle engine at 0 instead of NaN.
#                      Caveat: uvicorn runs --workers 2 with a per-process
#                      registry (see prometheus.yml), so the ratio is indicative,
#                      not exact, until the engine uses --workers 1 or
#                      multiprocess mode.
#   EngineReadinessDown
#                      up{job="fastapi"} -- generated by Prometheus itself, 1 when
#                      the /metrics scrape returned 200 with a parseable body.
#                      There is NO readiness metric: /api/v1/readiness answers 200
#                      even when not ready (body must be read), and nothing exports
#                      its `ready` field. Scrape-down is therefore the Prometheus-
#                      visible proxy for "not ready"; the authoritative readiness
#                      check remains healthcheck.sh section 5 / platform:doctor.
#   DiskSpaceLow       node_filesystem_avail_bytes / node_filesystem_size_bytes
#                      from node_exporter, which is NOT part of the base compose
#                      stack. This rule stays PENDING until that exporter is added
#                      on the appnet network (see docs/monitoring.md section 1).
#                      It is kept here so the threshold (15 % free) is reviewed in
#                      one place, not invented at 03:00. Do NOT graph or page on
#                      it until the target is UP.
#
# Celery queue depth deliberately has NO rule here: no exporter publishes it
# (celery exposes no Prometheus metric by default). Watch it with
# `docker compose exec redis redis-cli llen <queue>` (docs/monitoring.md
# section 5). Adding a `celery_queue_length` rule before the metric exists
# would fire "No data" forever -- that is fiction monitoring, and it is why
# this file is short.
groups:
  - name: aidata-engine
    interval: 15s
    rules:
      - alert: EngineErrorRate
        expr: |
          sum(rate(http_requests_total{job="fastapi", status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="fastapi"}[5m])), 0.001)
            > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Engine 5xx share above 1% for 5 minutes"
          description: "5xx ratio = sum(rate(5xx)) / sum(rate(all)) over 5m exceeds 0.01. The engine's unhandled-exception handler returns 500 with a redacted body, so check `docker compose logs fastapi` for the detail. Two-worker caveat applies (see header)."

      - alert: EngineReadinessDown
        expr: up{job="fastapi"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Engine /metrics scrape DOWN for 2 minutes"
          description: "Prometheus cannot scrape fastapi:8000/metrics. Confirm with `bash infrastructure/scripts/healthcheck.sh` sections 4-5 and `docker compose ps`. Note: this is the scrape proxy for readiness; true readiness (db/redis body) is not a metric."

  - name: aidata-disk
    interval: 30s
    rules:
      - alert: DiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/"}
              / node_filesystem_size_bytes{mountpoint="/"}
          ) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Root filesystem below 15% free for 10 minutes (needs node_exporter)"
          description: "Requires the node_exporter target, which is not in the base stack -- this rule is pending until then. When adding the exporter, run it on the appnet network and add the scrape job to prometheus.yml."
