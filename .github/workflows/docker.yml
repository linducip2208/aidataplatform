name: Docker Build

on:
  push:
    branches: [main]
    paths: ["application/**", "ai-engine/**", "infrastructure/docker/**", "docker-compose.yml"]
  pull_request:
    paths: ["application/**", "ai-engine/**", "infrastructure/docker/**", "docker-compose.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Laravel image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infrastructure/docker/laravel.Dockerfile
          push: false
          tags: aidata-laravel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-engine
          file: ./ai-engine/Dockerfile
          push: false
          tags: aidata-fastapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Hadolint (allow failure)
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true
        with:
          dockerfile: infrastructure/docker/laravel.Dockerfile

      - name: Trivy scan (allow failure)
        uses: aquasecurity/trivy-action@0.24.0
        continue-on-error: true
        with:
          image-ref: aidata-fastapi:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL

