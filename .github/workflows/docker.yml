      #   with:
      #     registry: ${{ secrets.REGISTRY_URL }}
      #     username: ${{ secrets.REGISTRY_USER }}
      #     password: ${{ secrets.REGISTRY_PASSWORD }}
      # - name: Push images
      #   run: |
      #     docker tag aidata-laravel:${{ github.sha }} ${{ secrets.REGISTRY_URL }}/aidata-laravel:${{ github.sha }}
      #     docker push ${{ secrets.REGISTRY_URL }}/aidata-laravel:${{ github.sha }}
