name: Python AI Engine CI

# Pytest suite for the FastAPI/Celery engine in ai-engine/.
# Path-filtered: a Laravel- or docs-only change does not burn Python CI minutes.
on:
  push:
    paths:
      - "ai-engine/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "ai-engine/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same ref cancels the in-flight run.
concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ai-engine
    # ai-engine/tests/__init__.py makes pytest prepend ai-engine/ to sys.path, so
    # `app` resolves today. Setting PYTHONPATH explicitly keeps that true if the
    # tests package layout ever changes.
    env:
      PYTHONPATH: ${{ github.workspace }}/ai-engine
      PYTHONDONTWRITEBYTECODE: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: aidata_test
          MYSQL_USER: aidata
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: test-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest-root"
          --health-interval=10s --health-timeout=5s --health-retries=5
          --default-authentication-plugin=mysql_native_password
          --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          # Matches the FROM python:3.13-slim in ai-engine/Dockerfile.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt

      - name: Install dependencies
        # pytest>=8.0 and pytest-asyncio>=0.23 are already in requirements.txt
        # (ai-engine/pytest.ini sets asyncio_mode = auto), so no second install.
        # aiomysql/PyMySQL come from the same file; pgvector is deliberately
        # absent so the embedding column falls back to JSON (see requirements).
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test (pytest)
        env:
          # aiomysql, not asyncpg: ai-engine/app/database/connection.py builds the
          # SQLAlchemy engine straight from DATABASE_URL, and requirements.txt
          # ships aiomysql/PyMySQL but no async driver for Postgres. An asyncpg://
          # URL makes create_engine() resolve an uninstalled driver at connect time.
          DATABASE_URL: mysql+aiomysql://aidata:test@localhost:3306/aidata_test
          # app/database/connection.py and alembic/env.py read this first; leaving
          # it unset would make them fall back to the value above.
          SYNC_DATABASE_URL: mysql+pymysql://aidata:test@localhost:3306/aidata_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          SERVICE_API_KEY: ci-test-key
          LLM_PROVIDER: openrouter
        run: pytest -q
